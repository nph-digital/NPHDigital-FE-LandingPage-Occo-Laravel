<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="stylesheet" href="globals.css" />
  <link rel="stylesheet" href="styleguide.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="property-default">
    <div class="overlap">
      <div class="ball">
        <div class="overlap-group">
          <div class="color"></div>
          <img class="light" src="img/light-3.png" />
        </div>
      </div>
      <div class="image-wrap">
        <div class="image"><img class="img" src="img/image-1792.png" /></div>
      </div>
      <div class="badge"><img class="chat-circle" src="img/chat-circle.svg" /></div>
      <div class="yu-thch">
        <div class="div">
          <img class="clip-path-group" src="img/clip-path-group-3.png" />
          <img class="clip-path-group-2" src="img/clip-path-group-2.png" />
          <img class="clip-path-group-3" src="img/clip-path-group.png" />
          <div class="overlap-2">
            <img class="vector" src="img/image.svg" />
            <img class="vector-2" src="img/vector-5.svg" />
            <img class="vector-3" src="img/vector-3.svg" />
            <img class="vector-4" src="img/vector-11.svg" />
            <img class="vector-5" src="img/vector-10.svg" />
            <img class="vector-6" src="img/vector-9.svg" />
            <div class="miss">
              <div class="group">
                <div class="overlap-group-2">
                  <div class="w">&gt;w&lt;</div>
                  <div class="text-wrapper">&gt;w&lt;</div>
                </div>
              </div>
              <div class="overlap-wrapper">
                <div class="overlap-group-2">
                  <div class="w">&gt;w&lt;</div>
                  <div class="text-wrapper">&gt;w&lt;</div>
                </div>
              </div>
            </div>
            <div class="text-wrapper-2">Yêu thích</div>
            <div class="text-wrapper-3">Yêu thích</div>
          </div>
          <div class="overlap-3">
            <img class="vector-7" src="img/vector.svg" />
            <img class="vector-8" src="img/vector-8.svg" />
            <img class="vector-9" src="img/vector-6.svg" />
          </div>
          <div class="overlap-4">
            <img class="vector-10" src="img/vector-12.svg" />
            <img class="vector-11" src="img/vector-7.svg" />
            <img class="vector-12" src="img/vector-4.svg" />
          </div>
        </div>
        <img class="vector-13" src="img/vector-2.svg" />
      </div>
    </div>
    <div class="overlap-5">
      <div class="overlap-group-wrapper">
        <div class="overlap-6">
          <div class="div-wrapper">
            <div class="overlap-group-3">
              <img class="ball-2" src="img/ball-3.png" />
              <div class="color-2"></div>
              <img class="light-2" src="img/light.png" />
            </div>
          </div>
          <div class="ball-3">
            <div class="overlap-7">
              <img class="ball-4" src="img/ball-2.png" />
              <div class="color-3"></div>
              <img class="light-3" src="img/light-2.png" />
            </div>
          </div>
        </div>
      </div>
      <div class="image-wrapper">
        <div class="img-wrapper"><img class="image-2" src="img/image-1791.png" /></div>
      </div>
      <div class="badge-2"><img class="heart" src="img/heart.svg" /></div>
    </div>
    <div class="content">
      <div class="frame">
        <p class="p">Kết nối Thiên Ý Kết bạn chỉ 1 chạm</p>
        <p class="text-wrapper-4">
          Chỉ một chạm, bạn đã sẵn sàng kết nối với những người bạn tâm giao? Tải ngay Occo để khám phá những mối quan
          hệ ý nghĩa, an toàn và đầy thú vị. Thiên Ý dẫn lối – bạn chỉ cần chạm!
        </p>
      </div>
      <img class="ellipse" src="img/ellipse-1905.svg" />
    </div>
    <div class="overlap-8">
      <img class="gif" src="img/gif-18.png" />
      <div class="badge-3">
        <div class="text-wrapper-5">Tải Occo</div>
      </div>
    </div>
  </div>
</body>

</html>
